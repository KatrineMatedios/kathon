server {
    listen __PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: serve index.html for client-side routes (/home, /admin/users, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets never change - cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
