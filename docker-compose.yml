services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: campus_lost_found
      MARIADB_USER: campus
      MARIADB_PASSWORD: campuspassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Campus Lost & Found"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      # Uncomment and set to reuse your existing key:
      # APP_KEY: base64:your-key-here

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: campus_lost_found
      DB_USERNAME: campus
      DB_PASSWORD: campuspassword

      SESSION_DRIVER: file
      SESSION_DOMAIN: localhost
      SANCTUM_STATEFUL_DOMAINS: localhost:8080,127.0.0.1:8080
    volumes:
      - storage_data:/var/www/html/storage

volumes:
  db_data:
  storage_data:
